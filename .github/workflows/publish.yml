name: publish

on:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1; the npm bundled with
      # Node 22 is 10.x, which never attempts the OIDC exchange and
      # fails the PUT with a misleading E404.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # OIDC trusted publishing — configure the npm trusted publisher for
      # the `tilemap-parser` package first; no NPM_TOKEN needed.
      - run: npm publish --provenance --access public
